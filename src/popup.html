<!doctype html>
<html>
<head><meta charset="utf-8"><title>Drive Markdown Preview</title>
<style>
body{font:13px sans-serif;width:340px;padding:12px;color-scheme:light dark}
h1{font-size:14px;margin:0 0 8px}
dl{margin:0 0 10px}dt{opacity:.7;margin-top:6px}dd{margin:0;word-break:break-all}
button{font:inherit;padding:4px 10px;margin-right:6px}
#msg{margin:0 0 10px}
</style></head>
<body>
  <h1>Drive Markdown Preview</h1>
  <p id="msg">Checking this tab&hellip;</p>
  <dl id="info" hidden></dl>
  <button id="force" hidden>Preview this file anyway</button>
  <button id="options">Options</button>
  <script src="popup.js"></script>
</body>
</html>
